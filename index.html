<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Kredensial Akun (Realtime DB)</title>
    
    <!-- Firebase App & Realtime Database SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            /* Overlay tipis agar gambar background terlihat jelas */
            background: linear-gradient(rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.25)), 
                        url('https://images4.alphacoders.com/606/thumb-1920-606301.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #1e293b;
            font-size: 10pt;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #ffffff;
            font-size: 22pt;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            font-weight: 800;
        }
        
        .panel-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 2px dashed #0284c7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        .form-row input {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 9pt;
            flex: 1;
            min-width: 150px;
        }
        .form-row input::placeholder {
            color: #94a3b8;
        }
        .form-row button {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .form-row button:hover {
            background-color: #0369a1;
        }
        .status-sync {
            text-align: center;
            font-size: 8.5pt;
            color: #16a34a;
            font-weight: bold;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border: 2px solid #06b6d4;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            position: relative;
        }
        .card-header {
            background-color: #06b6d4;
            color: #ffffff;
            text-align: center;
            font-weight: bold;
            padding: 10px;
            font-size: 12pt;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 7.5pt;
            cursor: pointer;
        }
        .card-body {
            display: flex;
            flex-direction: column;
        }
        .row-item {
            display: flex;
            border-bottom: 1px solid #e2e8f0;
        }
        .row-item:last-child {
            border-bottom: none;
        }
        .label {
            background-color: #7e22ce;
            color: #ffffff;
            width: 35%;
            padding: 8px 10px;
            font-weight: bold;
            font-size: 8.5pt;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .value-container {
            background-color: #2563eb;
            color: #ffffff;
            width: 65%;
            padding: 6px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
        }
        .value-text {
            font-size: 8.5pt;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .value-text a {
            color: #ffffff;
            text-decoration: underline;
        }
        .btn-copy {
            background-color: #ffffff;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 7.5pt;
            font-weight: bold;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .btn-copy:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }
        .btn-copy.copied {
            background-color: #16a34a;
            color: #ffffff;
            border-color: #16a34a;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>DASHBOARD LOGIN BATS</h1>
    
    <div class="panel-section">
        <div class="form-row">
            <input type="text" id="inputNama" placeholder="Nama Web / Platform">
            <input type="text" id="inputLink" placeholder="Link (URL)">
            <input type="text" id="inputUser" placeholder="Username / Email">
            <input type="text" id="inputPass" placeholder="Password">
            <button onclick="tambahKartuBaru()">+ Tambah Kartu</button>
        </div>
        <div class="status-sync" id="statusSync">Menghubungkan ke Realtime Database...</div>
    </div>

    <div class="grid-container" id="cardContainer"></div>
</div>

<script>
    // Konfigurasi Firebase dari project Anda (datalogin-cf028)
    const firebaseConfig = {
        apiKey: "AIzaSyDohM2GLzgWG-TP0K0V9ye71qHLdaLJRd0",
        authDomain: "datalogin-cf028.firebaseapp.com",
        databaseURL: "https://datalogin-cf028-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "datalogin-cf028",
        storageBucket: "datalogin-cf028.appspot.com",
        messagingSenderId: "324724574488",
        appId: "1:324724574488:web:62f40eeebcdd3feaf4366d"
    };

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let cardsData = [];

    const defaultCards = [
        {
            nama: "MINERAPAY",
            items: [
                { label: "LINK", val: "https://backoffice.minerapay.com/", isLink: true },
                { label: "USERNAME", val: "bilkisari8678@gmail.com", isLink: false },
                { label: "PASS", val: "Bats3105#", isLink: false }
            ]
        },
        {
            nama: "XPAY",
            items: [
                { label: "LINK", val: "https://m2qris.com/", isLink: true },
                { label: "USERNAME", val: "CS1_GOLTOGEL", isLink: false },
                { label: "PASS", val: "batol3105", isLink: false },
                { label: "EMAIL TOKO", val: "goltogel@xpayapi.com", isLink: false }
            ]
        }
    ];

    // Ambil data secara real-time dari Realtime Database
    function ambilDataFirebase() {
        const dbRef = database.ref('dashboard/kredensial');
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                cardsData = data;
                document.getElementById('statusSync').innerText = "Terhubung ke Realtime Database (Sinkron)";
            } else {
                cardsData = defaultCards;
                simpanKeFirebase();
            }
            renderCards();
        }, (error) => {
            document.getElementById('statusSync').innerText = "Gagal terhubung ke database!";
            console.error(error);
        });
    }

    // Simpan data ke Realtime Database
    function simpanKeFirebase() {
        database.ref('dashboard/kredensial').set(cardsData)
            .then(() => {
                console.log("Data berhasil disinkronkan!");
            })
            .catch((error) => {
                alert("Gagal menyimpan: " + error);
            });
    }

    function renderCards() {
        const container = document.getElementById('cardContainer');
        container.innerHTML = '';

        cardsData.forEach((card, cardIndex) => {
            let cardHTML = `
                <div class="card">
                    <div class="card-header">
                        <span>${card.nama}</span>
                        <button class="btn-delete" onclick="hapusKartu(${cardIndex})">Hapus</button>
                    </div>
                    <div class="card-body">
            `;

            card.items.forEach(item => {
                let valueDisplay = item.isLink 
                    ? `<a href="${item.val}" target="_blank">${item.val}</a>` 
                    : item.val;

                cardHTML += `
                    <div class="row-item">
                        <div class="label">${item.label}</div>
                        <div class="value-container">
                            <span class="value-text">${valueDisplay}</span>
                            <button class="btn-copy" onclick="copyText('${item.val}', this)">Salin</button>
                        </div>
                    </div>
                `;
            });

            cardHTML += `</div></div>`;
            container.innerHTML += cardHTML;
        });
    }

    function tambahKartuBaru() {
        const nama = document.getElementById('inputNama').value.trim();
        const link = document.getElementById('inputLink').value.trim();
        const user = document.getElementById('inputUser').value.trim();
        const pass = document.getElementById('inputPass').value.trim();

        if (!nama) {
            alert('Nama web / platform wajib diisi!');
            return;
        }

        let newCardItems = [];
        if (link) newCardItems.push({ label: "LINK", val: link, isLink: true });
        if (user) newCardItems.push({ label: "USERNAME", val: user, isLink: false });
        if (pass) newCardItems.push({ label: "PASS", val: pass, isLink: false });

        cardsData.push({
            nama: nama,
            items: newCardItems
        });

        simpanKeFirebase();

        document.getElementById('inputNama').value = '';
        document.getElementById('inputLink').value = '';
        document.getElementById('inputUser').value = '';
        document.getElementById('inputPass').value = '';
    }

    function hapusKartu(index) {
        if (confirm('Yakin ingin menghapus kartu ini?')) {
            cardsData.splice(index, 1);
            simpanKeFirebase();
        }
    }

    function copyText(text, buttonElement) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        
        try {
            const successful = document.execCommand('copy');
            if (successful) {
                const originalText = buttonElement.innerText;
                buttonElement.innerText = "OK!";
                buttonElement.classList.add("copied");
                
                setTimeout(() => {
                    buttonElement.innerText = originalText;
                    buttonElement.classList.remove("copied");
                }, 1500);
            } else {
                alert('Gagal menyalin teks.');
            }
        } catch (err) {
            alert('Browser tidak mendukung penyalinan otomatis.');
        }
        
        document.body.removeChild(textarea);
    }

    // Jalankan sinkronisasi data saat halaman dibuka
    ambilDataFirebase();
</script>

</body>
</html>
