<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Kredensial Akun</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 10pt;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #38bdf8;
            font-size: 20pt;
        }
        
        /* Style Form Tambah Data */
        .form-section {
            background: #1e293b;
            border: 2px dashed #38bdf8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        .form-section input {
            background: #0f172a;
            border: 1px solid #475569;
            color: #ffffff;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 9pt;
            flex: 1;
            min-width: 150px;
        }
        .form-section button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .form-section button:hover {
            background-color: #0ea5e9;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: #1e293b;
            border: 2px solid #00ffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }
        .card-header {
            background-color: #00ffff;
            color: #000000;
            text-align: center;
            font-weight: bold;
            padding: 10px;
            font-size: 12pt;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 7.5pt;
            cursor: pointer;
        }
        .card-body {
            display: flex;
            flex-direction: column;
        }
        .row-item {
            display: flex;
            border-bottom: 1px solid #334155;
        }
        .row-item:last-child {
            border-bottom: none;
        }
        .label {
            background-color: #9333ea;
            color: #ffffff;
            width: 35%;
            padding: 8px 10px;
            font-weight: bold;
            font-size: 8.5pt;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .value-container {
            background-color: #3b82f6;
            color: #ffffff;
            width: 65%;
            padding: 6px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
        }
        .value-text {
            font-size: 8.5pt;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .value-text a {
            color: #ffffff;
            text-decoration: underline;
        }
        .btn-copy {
            background-color: #0f172a;
            color: #00ffff;
            border: 1px solid #00ffff;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 7.5pt;
            font-weight: bold;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .btn-copy:hover {
            background-color: #00ffff;
            color: #0f172a;
        }
        .btn-copy.copied {
            background-color: #22c55e;
            color: #ffffff;
            border-color: #22c55e;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>DASHBOARD KREDENSIAL AKUN</h1>
    
    <!-- Form Tambah Data Manual -->
    <div class="form-section">
        <input type="text" id="inputNama" placeholder="Nama Web / Platform">
        <input type="text" id="inputLink" placeholder="Link (URL)">
        <input type="text" id="inputUser" placeholder="Username / Email">
        <input type="text" id="inputPass" placeholder="Password">
        <button onclick="tambahKartuBaru()">+ Tambah Kartu</button>
    </div>

    <!-- Tempat Kartu Ditampilkan -->
    <div class="grid-container" id="cardContainer">
        <!-- Kartu bawaan atau yang tersimpan akan muncul di sini -->
    </div>
</div>

<script>
    // Data Default Bawaan
    let defaultCards = [

        },
        {

            ]
        },
        {

            items: [
                { label: "LINK", val: "https://panel.otomatis.vip/goltogel/", isLink: true },
                { label: "USERNAME", val: "mqriscsgol5", isLink: false },
                { label: "PASS", val: "batol3105", isLink: false },

            ]
        },
        {
            nama: "ZONAMAIN",
            items: [
                { label: "LINK", val: "https://smbaz2.zonamain.com/", isLink: true },
                { label: "USERNAME", val: "bilkisari8678@gmail.com", isLink: false },
                { label: "PASS", val: "batol3105", isLink: false }
            ]
        },
        {
            nama: "ADMIN",
            items: [
                { label: "LINK", val: "http://agwl2.admitoto.com/?passkey=TydigZK2lk9Spbc", isLink: true },
                { label: "USERNAME", val: "wohaabilkis", isLink: false },
                { label: "PASS", val: "Batol3105#", isLink: false },
                { label: "PIN", val: "3105", isLink: false }
            ]
        },
        {
            nama: "MONTHLY & TO",
            items: [
                { label: "LINK", val: "http://monthly.alisampan.org", isLink: true },
                { label: "USERNAME", val: "bilkisari8678@gmail.com", isLink: false },
                { label: "PASS", val: "Batol3105#", isLink: false }
            ]
        },
        {
            nama: "KESALAHAN LC",
            items: [
                { label: "LINK", val: "https://salahmu.fun/", isLink: true },
                { label: "USERNAME", val: "bilkisari8678@gmail.com", isLink: false },
                { label: "PASS", val: "batol3105", isLink: false }
            ]
        },
        {
            nama: "BK",
            items: [
                { label: "LINK", val: "https://bk.augipt.com/goltogel/", isLink: true },
                { label: "USERNAME", val: "bilkisari8678@gmail.com", isLink: false },
                { label: "PASS", val: "batol3105", isLink: false }
            ]
        }
    ];

    // Ambil data dari LocalStorage jika ada, jika tidak pakai defaultCards
    let cardsData = JSON.parse(localStorage.getItem('dashboardKredensial')) || defaultCards;

    function renderCards() {
        const container = document.getElementById('cardContainer');
        container.innerHTML = '';

        cardsData.forEach((card, cardIndex) => {
            let cardHTML = `
                <div class="card">
                    <div class="card-header">
                        <span>${card.nama}</span>
                        <button class="btn-delete" onclick="hapusKartu(${cardIndex})">Hapus</button>
                    </div>
                    <div class="card-body">
            `;

            card.items.forEach(item => {
                let valueDisplay = item.isLink 
                    ? `<a href="${item.val}" target="_blank">${item.val}</a>` 
                    : item.val;

                cardHTML += `
                    <div class="row-item">
                        <div class="label">${item.label}</div>
                        <div class="value-container">
                            <span class="value-text">${valueDisplay}</span>
                            <button class="btn-copy" onclick="copyText('${item.val}', this)">Salin</button>
                        </div>
                    </div>
                `;
            });

            cardHTML += `</div></div>`;
            container.innerHTML += cardHTML;
        });
    }

    function tambahKartuBaru() {
        const nama = document.getElementById('inputNama').value.trim();
        const link = document.getElementById('inputLink').value.trim();
        const user = document.getElementById('inputUser').value.trim();
        const pass = document.getElementById('inputPass').value.trim();

        if (!nama) {
            alert('Nama web / platform wajib diisi!');
            return;
        }

        let newCardItems = [];
        if (link) newCardItems.push({ label: "LINK", val: link, isLink: true });
        if (user) newCardItems.push({ label: "USERNAME", val: user, isLink: false });
        if (pass) newCardItems.push({ label: "PASS", val: pass, isLink: false });

        cardsData.push({
            nama: nama,
            items: newCardItems
        });

        // Simpan ke LocalStorage browser
        localStorage.setItem('dashboardKredensial', JSON.stringify(cardsData));
        renderCards();

        // Reset Form
        document.getElementById('inputNama').value = '';
        document.getElementById('inputLink').value = '';
        document.getElementById('inputUser').value = '';
        document.getElementById('inputPass').value = '';
    }

    function hapusKartu(index) {
        if (confirm('Yakin ingin menghapus kartu ini?')) {
            cardsData.splice(index, 1);
            localStorage.setItem('dashboardKredensial', JSON.stringify(cardsData));
            renderCards();
        }
    }

    function copyText(text, buttonElement) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        
        try {
            const successful = document.execCommand('copy');
            if (successful) {
                const originalText = buttonElement.innerText;
                buttonElement.innerText = "OK!";
                buttonElement.classList.add("copied");
                
                setTimeout(() => {
                    buttonElement.innerText = originalText;
                    buttonElement.classList.remove("copied");
                }, 1500);
            } else {
                alert('Gagal menyalin teks.');
            }
        } catch (err) {
            alert('Browser tidak mendukung penyalinan otomatis.');
        }
        
        document.body.removeChild(textarea);
    }

    // Jalankan render saat halaman pertama kali dibuka
    renderCards();
</script>

</body>
</html>
